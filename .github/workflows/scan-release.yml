name: scan-release

# 管理画面でAPKがアップロードされると、Web から repository_dispatch(scan-release)で起動される。
# 手動で再検査したい場合は workflow_dispatch から release_id / download_url / callback_url を渡す。
on:
  repository_dispatch:
    types: [scan-release]
  workflow_dispatch:
    inputs:
      release_id:
        required: true
      download_url:
        required: true
      callback_url:
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 署名付きURLをログに出さない
        run: |
          echo "::add-mask::${{ github.event.client_payload.downloadUrl || inputs.download_url }}"
      # dexdump(APKのコードの解析)が無い環境では、コードを解析できず、自動承認されなくなる(すべて運営の確認になる)。
      # 検査そのものは止めないよう、無いときは警告だけを出す
      - name: 検査に使うツールを確認
        run: |
          root="$ANDROID_HOME/build-tools"
          for t in aapt2 apksigner dexdump; do
            found=$(ls "$root"/*/$t 2>/dev/null | sort -V | tail -1)
            if [ -z "$found" ]; then
              echo "::warning::$t が $root にありません。"$( [ "$t" = dexdump ] && echo "コードを解析できないため、公開前に必ず運営の確認が必要になります" || echo "検査に失敗します" )
            else
              echo "$t: $found"
            fi
          done
      - name: APK を検査して結果を通知
        env:
          RELEASE_ID: ${{ github.event.client_payload.releaseId || inputs.release_id }}
          DOWNLOAD_URL: ${{ github.event.client_payload.downloadUrl || inputs.download_url }}
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl || inputs.callback_url }}
          SCAN_WEBHOOK_SECRET: ${{ secrets.SCAN_WEBHOOK_SECRET }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: node workers/scan/inspect.mjs
