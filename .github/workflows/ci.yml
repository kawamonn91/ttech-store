name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (型チェック込み。ページは実行時にDBへ繋ぐのでダミーの環境変数で足りる)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

  worker:
    name: APK scan worker (parser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "workers/scan/*.test.mjs"

  android:
    name: Store app (unit tests / assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # android-actions/setup-android@v3 は、新しく追加されたSDKライセンス(android-googlexr-license 等)を
      # 固定回数の自動同意でしか処理できず失敗することがあるため使わない。ランナーに元から入っている
      # sdkmanager を直接使い、yes で全ライセンスに同意してから必要なパッケージだけ入れる。
      # cmdline-tools の bin はデフォルトでは PATH に無いため、明示的に追加する。
      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      # ランナーに焼き込まれた sdkmanager のパッケージ一覧が古く、新しい platforms/build-tools が
      # 見つからないことがあるため、インストール前に一覧を更新する(更新で追加された分の
      # ライセンスにも改めて同意する)。
      - name: Update SDK package list
        run: sdkmanager --update
      - name: Accept Android SDK licenses (after update)
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install SDK platform used by compileSdk
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: store-app/app/build/reports/tests/

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # マイグレーションが素のDBに適用できること(=スキーマの構文・依存関係が正しいこと)もここで確かめられる
      - name: Start local Supabase
        run: supabase start -x edge-runtime,imgproxy,logflare,vector,studio,mailpit,realtime,supavisor
      - name: Run pgTAP tests
        run: supabase test db
      - name: Stop
        if: always()
        run: supabase stop --no-backup
