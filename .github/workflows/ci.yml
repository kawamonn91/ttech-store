name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 本番(Raspberry Pi)は NodeSource の node_24.x を毎晩の apt で更新しているので、24 系の最新で確認する
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (型チェック込み。ページは実行時にDBへ繋ぐのでダミーの環境変数で足りる)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

  worker:
    name: APK scan worker (parser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
      - run: node --test "workers/scan/*.test.mjs"

  android:
    name: Store app (unit tests / assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # android-actions/setup-android@v3 は、新しく追加されたSDKライセンス(android-googlexr-license 等)を
      # 固定回数の自動同意でしか処理できず失敗することがあるため使わない。ランナーに元から入っている
      # sdkmanager を直接使い、yes で全ライセンスに同意してから必要なパッケージだけ入れる。
      # cmdline-tools の bin はデフォルトでは PATH に無いため、明示的に追加する。
      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      # sdkmanager 上のパッケージ名は "android-37" ではなく "android-37.0"(マイナーバージョン付き)。
      # Android Gradle Plugin は compileSdk = 37 を渡すと "android-37" という名前でプラットフォームを
      # 探すため、Android Studio がローカルでは互換用に "android-37" という別名フォルダを作っている。
      # CI にはその仕組みが無いので、インストール後に同じ内容で "android-37" フォルダを複製する。
      - name: Install SDK platform used by compileSdk
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --max-workers=2 --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: store-app/app/build/reports/tests/

  native-apps:
    name: Native apps (unit tests / assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-apps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # store-app と同じ理由(上のコメント参照)で、素の sdkmanager を直接使う
      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install SDK platform used by compileSdk
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
      - run: chmod +x gradlew
      # アプリを増やしても settings.gradle.kts に include するだけでよいよう、
      # 個別モジュール名を書かず全モジュール一括でテスト・ビルドする
      - run: ./gradlew testDebugUnitTest assembleDebug --max-workers=2 --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-apps-test-reports
          path: native-apps/*/build/reports/tests/

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest
      # マイグレーションが素のDBに適用できること(=スキーマの構文・依存関係が正しいこと)もここで確かめられる
      - name: Start local Supabase
        run: supabase start -x edge-runtime,imgproxy,logflare,vector,studio,mailpit,realtime,supavisor
      - name: Run pgTAP tests
        run: supabase test db
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  build:
    name: build
    runs-on: ubuntu-24.04
    needs: [web, worker, android, native-apps, database]
    steps:
      - run: echo "All CI checks passed"
